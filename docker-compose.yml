# ============================================
# ALTERNATIVA 1: Archivos locales FUERA de Docker
# ============================================
# Descomentar para usar archivos del host:
#
 services:
   microdocs:
     build:
       context: .
       dockerfile: Dockerfile
       args:
         DOCS_BASE_PATH: /app/docs-content
         DOCS_IS_EXTERNAL: "false"
     container_name: microdocs-app
     ports:
       - "4321:4321"
     environment:
       - NODE_ENV=production
       - HOST=0.0.0.0
       - PORT=4321
       - DOCS_BASE_PATH=/app/docs-content
       - DOCS_IS_EXTERNAL=false
     volumes:
       # Ruta absoluta en Windows
       - C:/Dev/learning/MicroDocs_content/docs-content:/app/docs-content:ro
       # Ruta absoluta en Linux/Mac
       # - /home/user/MicroDocs_content/docs-content:/app/docs-content:ro
     restart: unless-stopped

